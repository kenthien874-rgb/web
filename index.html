<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Legacy Hosting — Bot Hosting Platform</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue-d:#041b3d; --blue:#0e4d92; --green:#00c896; --green-d:#059669;
    --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.15);
    --txt:#e8f4ff; --muted:#9fb6cf; --danger:#ff5d6c;
  }
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--txt); overflow-x:hidden; background:#041b3d; min-height:100vh;
  }
  /* ===== NỀN CHUYỂN ĐỔI XANH DƯƠNG ĐẬM <-> XANH LÁ ===== */
  body::before{
    content:''; position:fixed; inset:-25%;
    background:linear-gradient(135deg,#041b3d,#0e4d92,#064e3b,#00c896,#0b6e4f,#0e4d92,#041b3d);
    background-size:400% 400%;
    animation:bgshift 18s ease infinite;
    z-index:-2;
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(circle at 20% 20%, rgba(0,200,150,.18), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(14,77,146,.35), transparent 50%);
  }
  @keyframes bgshift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  /* ===== CHUNG ===== */
  .btn{
    border:none; cursor:pointer; font:inherit; font-weight:600;
    padding:11px 18px; border-radius:11px; color:#041b3d;
    background:linear-gradient(135deg,var(--green),#4ade80);
    transition:.18s transform,.18s box-shadow,.18s opacity;
    box-shadow:0 6px 18px rgba(0,200,150,.28);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,200,150,.4)}
  .btn:active{transform:translateY(0)}
  .btn-ghost{
    background:rgba(255,255,255,.08); color:var(--txt);
    border:1px solid var(--glass-b); box-shadow:none;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.15);box-shadow:none}
  .btn-blue{background:linear-gradient(135deg,#2b7fff,#0e4d92);color:#fff;box-shadow:0 6px 18px rgba(43,127,255,.3)}
  .btn-danger{background:linear-gradient(135deg,#ff5d6c,#c0392b);color:#fff;box-shadow:none}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .w100{width:100%}
  input,select{
    width:100%; padding:12px 14px; border-radius:11px; font:inherit;
    background:rgba(255,255,255,.07); border:1px solid var(--glass-b);
    color:var(--txt); outline:none; transition:.18s;
  }
  input:focus,select:focus{border-color:var(--green);background:rgba(255,255,255,.11);box-shadow:0 0 0 3px rgba(0,200,150,.15)}
  input::placeholder{color:#7c93ab}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.3px}
  .field{margin-bottom:14px}
  .card{
    background:var(--glass); border:1px solid var(--glass-b);
    border-radius:18px; padding:22px; backdrop-filter:blur(14px);
  }
  h1,h2,h3{font-weight:700;letter-spacing:-.3px}
  .muted{color:var(--muted)}
  .small{font-size:13px}

  /* ===== AUTH ===== */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-card{
    width:100%; max-width:430px; padding:34px;
    background:rgba(6,26,52,.72); border:1px solid var(--glass-b);
    border-radius:24px; backdrop-filter:blur(22px);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    animation:pop .45s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
  .brand{display:flex;align-items:center;gap:13px;justify-content:center;margin-bottom:8px}
  .logo-mark{
    width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
    font-weight:800;font-size:19px;color:#041b3d;
    background:linear-gradient(135deg,var(--green),#38bdf8);
    box-shadow:0 8px 24px rgba(0,200,150,.4);
  }
  .brand-t{font-size:22px;font-weight:800;line-height:1}
  .brand-s{font-size:11px;letter-spacing:4px;color:var(--green);font-weight:700}
  .auth-sub{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 22px}
  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:13px;margin-bottom:22px}
  .tab{
    flex:1;padding:10px;border:none;background:transparent;color:var(--muted);
    font:inherit;font-weight:600;border-radius:9px;cursor:pointer;transition:.2s;
  }
  .tab.active{background:linear-gradient(135deg,var(--green),#38bdf8);color:#041b3d}

  /* ===== APP SHELL ===== */
  .shell{display:flex;min-height:100vh}
  .sidebar{
    width:250px;flex-shrink:0;padding:22px 16px;
    background:rgba(4,20,42,.62);border-right:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:22px;
    position:sticky;top:0;height:100vh;
  }
  .logo{display:flex;align-items:center;gap:11px;padding:0 6px}
  .logo-mark{width:42px;height:42px;font-size:16px;border-radius:12px}
  .logo-t{font-size:17px;font-weight:800;line-height:1.05}
  .logo-s{font-size:9px;letter-spacing:3.5px;color:var(--green);font-weight:700}
  nav{display:flex;flex-direction:column;gap:6px;flex:1}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:12px;
    background:transparent;border:none;color:var(--muted);font:inherit;font-weight:600;
    cursor:pointer;text-align:left;transition:.18s;font-size:14.5px;
  }
  .nav-item:hover{background:rgba(255,255,255,.07);color:var(--txt)}
  .nav-item.active{
    background:linear-gradient(135deg,rgba(0,200,150,.22),rgba(56,189,248,.14));
    color:#fff;border:1px solid rgba(0,200,150,.32);
  }
  .ni-icon{font-size:17px}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 28px;border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(4,20,42,.45);backdrop-filter:blur(14px);
    position:sticky;top:0;z-index:5;flex-wrap:wrap;
  }
  .user-chip{display:flex;align-items:center;gap:11px}
  .avatar{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    font-weight:800;color:#041b3d;background:linear-gradient(135deg,var(--green),#38bdf8);
  }
  .u-email{font-size:14px;font-weight:600;word-break:break-all}
  .u-role{font-size:11.5px;color:var(--green);font-weight:700;letter-spacing:.5px}
  .coin-chip{
    display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;
    background:linear-gradient(135deg,rgba(0,200,150,.2),rgba(56,189,248,.15));
    border:1px solid rgba(0,200,150,.35);font-weight:800;font-size:15px;
  }
  .content{padding:28px;flex:1;max-width:1200px;width:100%}
  .page-title{font-size:25px;margin-bottom:6px}
  .page-sub{color:var(--muted);font-size:14px;margin-bottom:22px}

  /* ===== GRID / STATS ===== */
  .grid{display:grid;gap:16px}
  .g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .stat{padding:20px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b)}
  .stat-ico{font-size:24px;margin-bottom:10px}
  .stat-num{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .stat-lbl{font-size:13px;color:var(--muted);margin-top:2px}

  /* ===== LISTS ===== */
  .row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 16px;border-radius:13px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);margin-bottom:10px;flex-wrap:wrap;
  }
  .row-title{font-weight:700;font-size:15px}
  .row-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .badge{
    display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;
    background:rgba(0,200,150,.18);color:#4ade80;border:1px solid rgba(0,200,150,.35);
  }
  .badge-off{background:rgba(255,93,108,.15);color:#ff8792;border-color:rgba(255,93,108,.35)}
  .badge-blue{background:rgba(56,189,248,.15);color:#7dd3fc;border-color:rgba(56,189,248,.35)}
  .code{
    font-family:ui-monospace,Consolas,monospace;font-size:14px;font-weight:700;
    color:#7dd3fc;letter-spacing:.5px;word-break:break-all;
  }
  .empty{
    text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;
    border:1px dashed rgba(255,255,255,.16);border-radius:16px;
  }

  /* ===== GIFT ===== */
  .gift-box{
    max-width:560px;margin:0 auto;text-align:center;padding:36px 28px;
    background:linear-gradient(160deg,rgba(0,200,150,.13),rgba(14,77,146,.22));
    border:1px solid rgba(0,200,150,.3);border-radius:22px;
  }
  .gift-ico{font-size:52px;margin-bottom:14px;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .gift-input{
    text-align:center;font-family:ui-monospace,monospace;font-size:17px;
    font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:20px 0 14px;
  }

  /* ===== TOAST ===== */
  #toast{
    position:fixed;top:22px;left:50%;transform:translate(-50%,-140%);
    padding:14px 24px;border-radius:13px;font-weight:700;font-size:14.5px;
    z-index:9999;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);
    backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.45);max-width:90vw;text-align:center;
  }
  #toast.show{transform:translate(-50%,0)}
  #toast.ok{background:rgba(0,200,150,.92);color:#041b3d}
  #toast.err{background:rgba(255,93,108,.94);color:#fff}

  /* ===== RESPONSIVE ===== */
  @media (max-width:860px){
    .shell{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;
      overflow-x:auto;padding:12px;gap:12px}
    .sidebar .logo{flex-shrink:0}
    nav{flex-direction:row;flex:1;overflow-x:auto}
    .nav-item{white-space:nowrap}
    .side-foot{display:none}
    .content{padding:18px}
    .topbar{padding:13px 18px}
  }
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>

<script>
/* =========================================================
   LEGACY HOSTING — Full app (localStorage)
   ========================================================= */

/* ---------- Utils ---------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const DB = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
const money = n => (n || 0).toLocaleString('vi-VN');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = type; }, 2800);
}

/* ---------- Tài khoản admin (ẩn, không hiển thị ở đâu cả) ---------- */
const ADMIN_EMAIL = String.fromCharCode(103,105,97,98,97,111,116,114,117,110,103,107,105,64,103,109,97,105,108,46,99,111,109);
const ADMIN_PASS  = String.fromCharCode(84,103,98,64,50,48,48,56);

/* ---------- Khởi tạo ---------- */
function initAdmin() {
  const users = DB.get('lh_users', []);
  if (!users.some(u => u.email === ADMIN_EMAIL)) {
    users.push({
      id: uid(),
      email: ADMIN_EMAIL,
      password: ADMIN_PASS,
      coins: 500000,
      isAdmin: true,
      bots: [],
      createdAt: Date.now()
    });
    DB.set('lh_users', users);
  }
}

/* ---------- Session helpers ---------- */
function getUsers() { return DB.get('lh_users', []); }
function getUser() {
  const email = DB.get('lh_session', null);
  if (!email) return null;
  return getUsers().find(u => u.email === email) || null;
}
function saveUser(u) {
  const users = getUsers();
  const i = users.findIndex(x => x.email === u.email);
  if (i >= 0) users[i] = u; else users.push(u);
  DB.set('lh_users', users);
}

/* ---------- State ---------- */
let page = 'dashboard';

/* =========================================================
   AUTH VIEW
   ========================================================= */
function authView() {
  return `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="logo-mark">LH</div>
        <div>
          <div class="brand-t">Legacy</div>
          <div class="brand-s">HOSTING</div>
        </div>
      </div>
      <p class="auth-sub">Nền tảng host bot miễn phí • Nhanh • Ổn định 24/7</p>

      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">Đăng nhập</button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">Đăng ký</button>
      </div>

      <div id="formLogin">
        <div class="field">
          <label>Email</label>
          <input id="lgEmail" type="email" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label>Mật khẩu</label>
          <input id="lgPass" type="password" placeholder="••••••••" autocomplete="current-password"
                 onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn w100" onclick="doLogin()">Đăng nhập</button>
      </div>

      <div id="formRegister" style="display:none">
        <div class="field">
          <label>Email</label>
          <input id="rgEmail" type="email" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label>Mật khẩu</label>
          <input id="rgPass" type="password" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
        </div>
        <div class="field">
          <label>Nhập lại mật khẩu</label>
          <input id="rgPass2" type="password" placeholder="••••••••" autocomplete="new-password"
                 onkeydown="if(event.key==='Enter')doRegister()">
        </div>
        <button class="btn w100" onclick="doRegister()">Tạo tài khoản</button>
      </div>

      <p class="small muted" style="text-align:center;margin-top:18px">
        Bằng việc tiếp tục, bạn đồng ý với Điều khoản dịch vụ.
      </p>
    </div>
  </div>`;
}

function switchTab(t) {
  const isLogin = t === 'login';
  document.getElementById('formLogin').style.display = isLogin ? 'block' : 'none';
  document.getElementById('formRegister').style.display = isLogin ? 'none' : 'block';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
}

function doLogin() {
  const email = document.getElementById('lgEmail').value.trim().toLowerCase();
  const pass = document.getElementById('lgPass').value;
  if (!email || !pass) return toast('Vui lòng nhập đầy đủ thông tin', 'err');

  const user = getUsers().find(u => u.email === email && u.password === pass);
  if (!user) return toast('Email hoặc mật khẩu không đúng', 'err');

  DB.set('lh_session', user.email);
  page = 'dashboard';
  toast('Đăng nhập thành công!');
  render();
}

function doRegister() {
  const email = document.getElementById('rgEmail').value.trim().toLowerCase();
  const pass = document.getElementById('rgPass').value;
  const pass2 = document.getElementById('rgPass2').value;

  if (!email || !pass) return toast('Vui lòng nhập đầy đủ thông tin', 'err');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Email không hợp lệ', 'err');
  if (pass.length < 6) return toast('Mật khẩu phải từ 6 ký tự', 'err');
  if (pass !== pass2) return toast('Mật khẩu nhập lại không khớp', 'err');
  if (getUsers().some(u => u.email === email)) return toast('Email này đã được đăng ký', 'err');

  const user = {
    id: uid(),
    email,
    password: pass,
    coins: 200,          // tặng 200 xu khởi đầu
    isAdmin: false,
    bots: [],
    createdAt: Date.now()
  };
  const users = getUsers();
  users.push(user);
  DB.set('lh_users', users);
  DB.set('lh_session', user.email);

  page = 'dashboard';
  toast('Đăng ký thành công! Bạn được tặng 200 xu 🎉');
  render();
}

function logout() {
  DB.set('lh_session', null);
  page = 'dashboard';
  render();
}

/* =========================================================
   APP VIEW
   ========================================================= */
function navItem(id, icon, label) {
  return `<button class="nav-item ${page === id ? 'active' : ''}" onclick="nav('${id}')">
    <span class="ni-icon">${icon}</span><span>${label}</span>
  </button>`;
}

function nav(p) { page = p; render(); }

function appView(user) {
  return `
  <div class="shell">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-mark">LH</div>
        <div>
          <div class="logo-t">Legacy</div>
          <div class="logo-s">HOSTING</div>
        </div>
      </div>

      <nav>
        ${navItem('dashboard', '📊', 'Tổng quan')}
        ${navItem('bots', '🤖', 'Bot của tôi')}
        ${navItem('gift', '🎁', 'Nhập Gift Code')}
        ${navItem('plans', '🚀', 'Gói Hosting')}
        ${user.isAdmin ? navItem('admin', '🛡️', 'Quản trị') : ''}
      </nav>

      <div class="side-foot">
        <button class="btn btn-ghost w100" onclick="logout()">Đăng xuất</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="user-chip">
          <div class="avatar">${esc(user.email[0].toUpperCase())}</div>
          <div>
            <div class="u-email">${esc(user.email)}</div>
            <div class="u-role">${user.isAdmin ? '★ QUẢN TRỊ VIÊN' : 'THÀNH VIÊN'}</div>
          </div>
        </div>
        <div class="coin-chip">🪙 <span>${money(user.coins)}</span> xu</div>
      </header>
      <div class="content">${pageView(user)}</div>
    </main>
  </div>`;
}

/* =========================================================
   PAGES
   ========================================================= */
function pageView(user) {
  switch (page) {
    case 'bots':  return pageBots(user);
    case 'gift':  return pageGift(user);
    case 'plans': return pagePlans(user);
    case 'admin': return user.isAdmin ? pageAdmin(user) : pageDashboard(user);
    default:      return pageDashboard(user);
  }
}

/* ---------- Dashboard ---------- */
function pageDashboard(user) {
  const running = user.bots.filter(b => b.status === 'running').length;
  const claimed = DB.get('lh_gifts', []).filter(g => (g.claimedBy || []).includes(user.email)).length;

  return `
  <h1 class="page-title">Xin chào, ${esc(user.email.split('@')[0])} 👋</h1>
  <p class="page-sub">Chào mừng bạn đến với Legacy Hosting — nền tảng host bot miễn phí.</p>

  <div class="grid g3" style="margin-bottom:22px">
    <div class="stat">
      <div class="stat-ico">🪙</div>
      <div class="stat-num">${money(user.coins)}</div>
      <div class="stat-lbl">Số dư xu hiện tại</div>
    </div>
    <div class="stat">
      <div class="stat-ico">🤖</div>
      <div class="stat-num">${user.bots.length}</div>
      <div class="stat-lbl">Tổng số bot (${running} đang chạy)</div>
    </div>
    <div class="stat">
      <div class="stat-ico">🎁</div>
      <div class="stat-num">${claimed}</div>
      <div class="stat-lbl">Gift code đã nhận</div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px">⚡ Thao tác nhanh</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="nav('gift')">🎁 Nhập Gift Code</button>
      <button class="btn btn-ghost" onclick="nav('bots')">🤖 Tạo Bot mới</button>
      <button class="btn btn-ghost" onclick="nav('plans')">🚀 Xem gói Hosting</button>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <h3 style="margin-bottom:12px">📢 Thông báo hệ thống</h3>
    <div class="row">
      <div>
        <div class="row-title">Hệ thống ổn định 99.9%</div>
        <div class="row-sub">Tất cả node đang hoạt động bình thường.</div>
      </div>
      <span class="badge">ONLINE</span>
    </div>
    <div class="row">
      <div>
        <div class="row-title">Sự kiện tặng Gift Code</div>
        <div class="row-sub">Theo dõi kênh thông báo để nhận code miễn phí mỗi tuần.</div>
      </div>
      <span class="badge badge-blue">EVENT</span>
    </div>
  </div>`;
}

/* ---------- Bots ---------- */
const BOT_NAMES = ['Nova', 'Atlas', 'Orion', 'Phoenix', 'Titan', 'Echo', 'Vortex', 'Zenith', 'Cipher', 'Lunar'];
const BOT_TYPES = ['Discord Bot', 'Telegram Bot', 'Music Bot', 'Moderation Bot', 'Economy Bot', 'Utility Bot'];

function pageBots(user) {
  const list = user.bots.length
    ? user.bots.map(b => `
      <div class="row">
        <div>
          <div class="row-title">🤖 ${esc(b.name)} <span class="badge ${b.status === 'running' ? '' : 'badge-off'}"
             style="margin-left:6px">${b.status === 'running' ? 'ĐANG CHẠY' : 'ĐÃ DỪNG'}</span></div>
          <div class="row-sub">${esc(b.type)} • Tạo ngày ${new Date(b.createdAt).toLocaleDateString('vi-VN')}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-ghost" onclick="toggleBot('${b.id}')">
            ${b.status === 'running' ? '⏸ Dừng' : '▶ Chạy'}
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteBot('${b.id}')">🗑 Xoá</button>
        </div>
      </div>`).join('')
    : `<div class="empty">Bạn chưa có bot nào. Hãy tạo bot đầu tiên của bạn! 🚀</div>`;

  return `
  <h1 class="page-title">Bot của tôi</h1>
  <p class="page-sub">Quản lý các bot đang được host trên Legacy Hosting.</p>

  <div class="card" style="margin-bottom:18px">
    <h3 style="margin-bottom:14px">➕ Tạo Bot mới</h3>
    <div class="grid g2">
      <div class="field">
        <label>Tên Bot</label>
        <input id="botName" placeholder="VD: Nova Bot" maxlength="24">
      </div>
      <div class="field">
        <label>Loại Bot</label>
        <select id="botType">
          ${BOT_TYPES.map(t => `<option>${t}</option>`).join('')}
        </select>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">
      <div class="small muted">Chi phí: <b style="color:var(--green)">50 xu</b> / bot</div>
      <button class="btn" onclick="createBot()">🚀 Tạo Bot</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px">Danh sách Bot (${user.bots.length})</h3>
    ${list}
  </div>`;
}

function createBot() {
  const user = getUser(); if (!user) return;
  if (user.coins < 50) return toast('Bạn không đủ xu (cần 50 xu)', 'err');

  const nameInput = document.getElementById('botName').value.trim();
  const name = nameInput || (BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)] + '-' + Math.floor(Math.random() * 900 + 100));
  const type = document.getElementById('botType').value;

  user.coins -= 50;
  user.bots.push({ id: uid(), name, type, status: 'running', createdAt: Date.now() });
  saveUser(user);
  toast('Tạo bot thành công! (-50 xu)');
  render();
}

function toggleBot(id) {
  const user = getUser(); if (!user) return;
  const bot = user.bots.find(b => b.id === id); if (!bot) return;
  bot.status = bot.status === 'running' ? 'stopped' : 'running';
  saveUser(user);
  render();
}

function deleteBot(id) {
  const user = getUser(); if (!user) return;
  user.bots = user.bots.filter(b => b.id !== id);
  saveUser(user);
  toast('Đã xoá bot');
  render();
}

/* ---------- Gift ---------- */
function pageGift(user) {
  const gifts = DB.get('lh_gifts', []);
  const mine = gifts.filter(g => (g.claimedBy || []).includes(user.email));

  const history = mine.length
    ? mine.map(g => `
      <div class="row">
        <div>
          <div class="row-title code">${esc(g.code)}</div>
          <div class="row-sub">Đã nhận ${new Date(g.claimedAt?.[user.email] || Date.now()).toLocaleString('vi-VN')}</div>
        </div>
        <span class="badge">+${money(g.amount)} xu</span>
      </div>`).join('')
    : `<div class="empty">Bạn chưa nhận gift code nào.</div>`;

  return `
  <h1 class="page-title">Nhập Gift Code</h1>
  <p class="page-sub">Nhập mã quà tặng để nhận xu miễn phí vào tài khoản.</p>

  <div class="gift-box">
    <div class="gift-ico">🎁</div>
    <h2 style="font-size:21px">Nhận xu miễn phí</h2>
    <p class="muted small" style="margin-top:8px">Dán mã gift code của bạn vào ô bên dưới</p>
    <input id="giftCode" class="gift-input" placeholder="LEGACY-XXXX-XXXX-XXXX"
           onkeydown="if(event.key==='Enter')redeemGift()">
    <button class="btn w100" onclick="redeemGift()">🎉 Nhận xu ngay</button>
    <p class="small muted" style="margin-top:14px">Mỗi mã chỉ được nhận 1 lần / tài khoản.</p>
  </div>

  <div class="card" style="margin-top:22px">
    <h3 style="margin-bottom:14px">📜 Lịch sử nhận quà (${mine.length})</h3>
    ${history}
  </div>`;
}

function redeemGift() {
  const user = getUser(); if (!user) return;
  const input = document.getElementById('giftCode');
  const code = input.value.trim().toUpperCase();
  if (!code) return toast('Vui lòng nhập gift code', 'err');

  const gifts = DB.get('lh_gifts', []);
  const gift = gifts.find(g => g.code.toUpperCase() === code);

  if (!gift) return toast('Gift code không tồn tại ❌', 'err');
  if (gift.used >= gift.maxUses) return toast('Gift code này đã hết lượt sử dụng', 'err');

  gift.claimedBy = gift.claimedBy || [];
  if (gift.claimedBy.includes(user.email)) return toast('Bạn đã nhận gift code này rồi', 'err');

  gift.claimedBy.push(user.email);
  gift.used = (gift.used || 0) + 1;
  gift.claimedAt = gift.claimedAt || {};
  gift.claimedAt[user.email] = Date.now();

  DB.set('lh_gifts', gifts);

  user.coins += gift.amount;
  saveUser(user);

  toast(`🎉 Nhận thành công +${money(gift.amount)} xu!`);
  render();
}

/* ---------- Plans ---------- */
const PLANS = [
  { name: 'Free',    icon: '🌱', price: 0,     bots: 1,  ram: '256 MB',  cpu: '0.5 vCPU', color: '#7dd3fc' },
  { name: 'Starter', icon: '🚀', price: 500,   bots: 3,  ram: '512 MB',  cpu: '1 vCPU',   color: '#4ade80' },
  { name: 'Pro',     icon: '⚡', price: 2000,  bots: 10, ram: '2 GB',    cpu: '2 vCPU',   color: '#00c896' },
  { name: 'Ultra',   icon: '👑', price: 5000,  bots: 999,ram: '8 GB',    cpu: '4 vCPU',   color: '#fbbf24' }
];

function pagePlans(user) {
  const cards = PLANS.map(p => `
    <div class="card" style="border-color:${p.color}44;background:linear-gradient(160deg,${p.color}14,rgba(255,255,255,.04))">
      <div style="font-size:30px;margin-bottom:8px">${p.icon}</div>
      <h3 style="font-size:19px;color:${p.color}">${p.name}</h3>
      <div style="font-size:26px;font-weight:800;margin:10px 0 2px">
        ${p.price === 0 ? 'Miễn phí' : money(p.price) + ' xu'}
      </div>
      <div class="small muted" style="margin-bottom:14px">${p.price === 0 ? 'vĩnh viễn' : '/ tháng'}</div>
      <div class="small" style="line-height:2;margin-bottom:16px">
        🤖 ${p.bots} bot<br>
        💾 ${p.ram} RAM<br>
        ⚙️ ${p.cpu}<br>
        🌐 Uptime 24/7
      </div>
      <button class="btn w100" onclick="buyPlan('${p.name}',${p.price})"
        ${p.price === 0 ? 'disabled style="opacity:.55;cursor:default"' : ''}>
        ${p.price === 0 ? 'Gói hiện tại' : 'Mua gói'}
      </button>
    </div>`).join('');

  return `
  <h1 class="page-title">Gói Hosting</h1>
  <p class="page-sub">Nâng cấp gói để có thêm tài nguyên và slot bot.</p>
  <div class="grid g3">${cards}</div>`;
}

function buyPlan(name, price) {
  const user = getUser(); if (!user) return;
  if (user.coins < price) return toast('Bạn không đủ xu để mua gói này', 'err');
  user.coins -= price;
  saveUser(user);
  toast(`Mua gói ${name} thành công! (-${money(price)} xu)`);
  render();
}

/* =========================================================
   ADMIN PANEL
   ========================================================= */
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const part = () => Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  return `LEGACY-${part()}-${part()}-${part()}`;
}

function pageAdmin(user) {
  const gifts = DB.get('lh_gifts', []).slice().sort((a, b) => b.createdAt - a.createdAt);
  const users = getUsers();
  const totalCoins = gifts.reduce((s, g) => s + g.amount * (g.used || 0), 0);

  const giftRows = gifts.length
    ? gifts.map(g => `
      <div class="row">
        <div style="min-width:0">
          <div class="row-title code">${esc(g.code)}</div>
          <div class="row-sub">
            ${money(g.amount)} xu • Đã dùng ${g.used || 0}/${g.maxUses} •
            ${new Date(g.createdAt).toLocaleString('vi-VN')}
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="badge ${(g.used || 0) >= g.maxUses ? 'badge-off' : ''}">
            ${(g.used || 0) >= g.maxUses ? 'HẾT LƯỢT' : 'CÒN HIỆU LỰC'}
          </span>
          <button class="btn btn-sm btn-ghost" onclick="copyCode('${esc(g.code)}')">📋 Copy</button>
          <button class="btn btn-sm btn-danger" onclick="adminDeleteGift('${esc(g.code)}')">🗑</button>
        </div>
      </div>`).join('')
    : `<div class="empty">Chưa có gift code nào được tạo.</div>`;

  const userRows = users.map(u => `
    <div class="row">
      <div style="min-width:0">
        <div class="row-title">${esc(u.email)} ${u.isAdmin ? '<span class="badge badge-blue">ADMIN</span>' : ''}</div>
        <div class="row-sub">${u.bots.length} bot • Tham gia ${new Date(u.createdAt).toLocaleDateString('vi-VN')}</div>
      </div>
      <span class="badge">${money(u.coins)} xu</span>
    </div>`).join('');

  return `
  <h1 class="page-title">🛡️ Quản trị hệ thống</h1>
  <p class="page-sub">Tạo gift code và quản lý người dùng.</p>

  <div class="grid g3" style="margin-bottom:20px">
    <div class="stat"><div class="stat-ico">👥</div><div class="stat-num">${users.length}</div><div class="stat-lbl">Tổng người dùng</div></div>
    <div class="stat"><div class="stat-ico">🎁</div><div class="stat-num">${gifts.length}</div><div class="stat-lbl">Tổng gift code</div></div>
    <div class="stat"><div class="stat-ico">🪙</div><div class="stat-num">${money(totalCoins)}</div><div class="stat-lbl">Xu đã phát qua gift</div></div>
  </div>

  <div class="card" style="margin-bottom:20px">
    <h3 style="margin-bottom:16px">➕ Tạo Gift Code mới</h3>
    <div class="grid g2">
      <div class="field">
        <label>Số xu tặng</label>
        <input id="gAmount" type="number" min="1" value="1000" placeholder="1000">
      </div>
      <div class="field">
        <label>Số lượt sử dụng tối đa</label>
        <input id="gMax" type="number" min="1" value="10" placeholder="10">
      </div>
    </div>
    <div class="field">
      <label>Mã tuỳ chỉnh (để trống = tự sinh)</label>
      <input id="gCode" placeholder="VD: LEGACY-TET2025" style="font-family:ui-monospace,monospace">
    </div>
    <button class="btn" onclick="adminCreateGift()">🎁 Tạo Gift Code</button>
  </div>

  <div class="card" style="margin-bottom:20px">
    <h3 style="margin-bottom:14px">📋 Danh sách Gift Code (${gifts.length})</h3>
    ${giftRows}
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px">👥 Danh sách người dùng (${users.length})</h3>
    ${userRows}
  </div>`;
}

function adminCreateGift() {
  const user = getUser();
  if (!user || !user.isAdmin) return toast('Không có quyền truy cập', 'err');

  const amount = parseInt(document.getElementById('gAmount').value, 10);
  const maxUses = parseInt(document.getElementById('gMax').value, 10);
  let code = document.getElementById('gCode').value.trim().toUpperCase();

  if (!amount || amount <= 0) return toast('Số xu không hợp lệ', 'err');
  if (!maxUses || maxUses <= 0) return toast('Số lượt không hợp lệ', 'err');

  const gifts = DB.get('lh_gifts', []);
  if (!code) {
    do { code = genCode(); } while (gifts.some(g => g.code.toUpperCase() === code));
  } else if (gifts.some(g => g.code.toUpperCase() === code)) {
    return toast('Mã này đã tồn tại', 'err');
  }

  gifts.push({
    code,
    amount,
    maxUses,
    used: 0,
    claimedBy: [],
    claimedAt: {},
    createdAt: Date.now(),
    createdBy: user.email
  });
  DB.set('lh_gifts', gifts);

  toast(`Đã tạo gift: ${code}`);
  render();
  setTimeout(() => { const el = document.getElementById('gCode'); if (el) el.value = ''; }, 0);
}

function adminDeleteGift(code) {
  const user = getUser();
  if (!user || !user.isAdmin) return toast('Không có quyền truy cập', 'err');
  const gifts = DB.get('lh_gifts', []).filter(g => g.code !== code);
  DB.set('lh_gifts', gifts);
  toast('Đã xoá gift code');
  render();
}

function copyCode(code) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(() => toast('Đã copy: ' + code));
  } else {
    const ta = document.createElement('textarea');
    ta.value = code; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('Đã copy: ' + code);
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const app = document.getElementById('app');
  const user = getUser();

  if (!user) {
    app.innerHTML = authView();
    return;
  }

  if (page === 'admin' && !user.isAdmin) page = 'dashboard';

  app.innerHTML = appView(user);
}

/* ---------- Khởi động ---------- */
initAdmin();
render();
</script>
